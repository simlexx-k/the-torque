services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: thetorque
      POSTGRES_USER: thetorque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - torque_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thetorque -d thetorque"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://thetorque:${POSTGRES_PASSWORD:-change-me}@db:5432/thetorque
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  torque_postgres:
