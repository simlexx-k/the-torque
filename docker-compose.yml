services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: thetorque
      POSTGRES_USER: thetorque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - torque_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thetorque -d thetorque"]
      interval: 5s
      timeout: 5s
      retries: 12
      # Fresh PostgreSQL volumes can spend a while initializing and restarting
      # the temporary bootstrap server. Ignore failures during that phase.
      start_period: 90s

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://thetorque:${POSTGRES_PASSWORD:-change-me}@db:5432/thetorque
    ports:
      # Keep a loopback-only host port for VPS health checks/debugging.
      # Public traffic reaches the app over the internal Compose network via cloudflared.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
        restart: true

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Remotely managed tunnel token. Keep the real value only in the VPS .env file.
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN}
    depends_on:
      app:
        condition: service_healthy
        restart: true

volumes:
  torque_postgres:
