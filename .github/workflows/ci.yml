name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m compileall -q app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node -e "JSON.parse(require('fs').readFileSync('../vercel.json', 'utf8'))"
      - run: npm install --no-audit --no-fund
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose deployment
        env:
          CLOUDFLARED_TOKEN: ci-placeholder-token
          POSTGRES_PASSWORD: ci-placeholder-password
        run: |
          cp .env.example .env
          docker compose config --quiet
